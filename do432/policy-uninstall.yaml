apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-uninstall-odf
  namespace: default
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # 1. Delete the Subscription
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-odf-remove-subscription
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: odf-operator
                  namespace: openshift-storage
                  
    # 2. Delete the ClusterServiceVersion (CSV) to kill the pods
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-odf-remove-csv
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: ClusterServiceVersion
                metadata:
                  name: odf-operator.v4.18.4-rhodf
                  namespace: openshift-storage
                  
    # 3. Delete the OperatorGroup
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-odf-remove-operatorgroup
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: openshift-storage-og
                  namespace: openshift-storage
